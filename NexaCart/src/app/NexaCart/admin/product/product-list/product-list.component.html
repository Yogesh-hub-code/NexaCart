<app-admin-layout pageLabel="Admin / Products" pageTitle="Product Management">

  <!-- Action button -->
  <button slot="actions" type="button" class="ad-btn-primary" (click)="addProduct()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Add Product
  </button>

  <!-- Table -->
  <app-admin-table
    [rows]="products"
    [columns]="tableColumns"
    [isLoading]="loading"
    [searchKeys]="['name','sku']"
    searchPlaceholder="Search products..."
    emptyMessage="No products yet. Click Add Product to get started."
    (editRow)="editProduct($event.productId)"
    (deleteRow)="deleteProduct($event.productId)">
  </app-admin-table>

</app-admin-layout>
