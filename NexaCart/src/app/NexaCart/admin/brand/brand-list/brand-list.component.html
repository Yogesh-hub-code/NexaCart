<app-admin-layout pageLabel="Admin / Brands" pageTitle="Brand Management">

  <!-- Action button -->
  <button slot="actions" type="button" class="ad-btn-primary" (click)="addBrand()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Add Brand
  </button>

  <!-- Table -->
  <app-admin-table
    [rows]="brands"
    [columns]="tableColumns"
    [isLoading]="isLoading"
    [searchKeys]="['brandName','description']"
    searchPlaceholder="Search brands..."
    emptyMessage="No brands yet. Click Add Brand to get started."
    (editRow)="editBrand($event.brandId)"
    (deleteRow)="deleteBrand($event.brandId)">
  </app-admin-table>

</app-admin-layout>
