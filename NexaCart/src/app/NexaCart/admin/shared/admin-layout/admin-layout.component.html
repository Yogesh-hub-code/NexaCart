<div class="ad-shell">

  <!-- Sidebar -->
  <aside class="ad-sidebar">
    <a class="ad-logo" routerLink="/">
      <div class="ad-logo-icon"><span>N</span></div>
      <span class="ad-logo-text">Nexa<em>Cart</em></span>
    </a>

    <nav class="ad-nav">
      <span class="ad-nav-label">Management</span>

      <a routerLink="/admin" routerLinkActive="ad-nav-link--active"
         [routerLinkActiveOptions]="{exact:true}" class="ad-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a routerLink="/admin/categories" routerLinkActive="ad-nav-link--active" class="ad-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        Categories
      </a>

      <a routerLink="/admin/brands" routerLinkActive="ad-nav-link--active" class="ad-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        Brands
      </a>

      <a routerLink="/admin/products" routerLinkActive="ad-nav-link--active" class="ad-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
        Products
      </a>

      <a class="ad-nav-link ad-nav-link--soon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Orders
        <span class="ad-soon-badge">Soon</span>
      </a>

      <a class="ad-nav-link ad-nav-link--soon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Users
        <span class="ad-soon-badge">Soon</span>
      </a>
    </nav>

    <a routerLink="/" class="ad-back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Back to Store
    </a>
  </aside>

  <!-- Main -->
  <div class="ad-main">

    <!-- Top bar slot -->
    <header class="ad-topbar">
      <div>
        <p class="ad-page-label">{{ pageLabel }}</p>
        <h1 class="ad-page-title">{{ pageTitle }}</h1>
      </div>
      <!-- Action button projected from parent -->
      <ng-content select="[slot=actions]"></ng-content>
    </header>

    <!-- Main content projected from parent -->
    <ng-content></ng-content>

  </div>
</div>
