<app-admin-layout pageLabel="Admin / Categories" pageTitle="Category Management">

  <!-- Action button -->
  <a slot="actions" routerLink="/admin/categories/add" class="ad-btn-primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Add Category
  </a>

  <!-- Table -->
  <app-admin-table
    [rows]="categories"
    [columns]="tableColumns"
    [isLoading]="isLoading"
    [searchKeys]="['name','description']"
    searchPlaceholder="Search categories..."
    emptyMessage="No categories yet. Click Add Category to get started."
    (editRow)="editCategory($event)"
    (deleteRow)="deleteCategory($event.categoryId)">
  </app-admin-table>

</app-admin-layout>
